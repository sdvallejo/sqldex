# What has to hold on somebody else's machine, not just on the one it was written on.
#
# The suite declares no schema and reaches no network: every test builds its project out of fixtures
# checked in beside it, which is what lets this run with nothing configured. The performance budget
# is deliberately **not** here — it measures over private corpora, and stays where they live.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor the README promises: the release where type stripping stopped needing
        # a flag, and therefore where a `bin` that is a `.ts` file runs at all.
        node: ["22.18", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  typecheck:
    # Once, on the floor version: the types do not depend on which Node runs them, and a second copy
    # of this job would only be a second thing to keep in step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npm run typecheck
      # The build is what publishing ships, and it broke once without anything noticing.
      - run: npm run build

  packaged:
    # The suite above proves the sources work. It cannot prove an install does, and that gap is not
    # hypothetical: every test calls into the code in process, under `--conditions=development`, so
    # a package that resolves nothing once built is still green. Two releases shipped a syntax check
    # that could not start for exactly that reason. This job runs the built CLI and the built server
    # as separate processes, the way an install does, and asks each for a finding only a working
    # worker thread can produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm ci
      - run: npm run build
      - run: npm run check:packaged
  zed:
    # The Zed client is the one part of this repository that is not TypeScript, and the only one
    # with a compile step that the other jobs would never reach. Zed builds an extension to
    # `wasm32-wasip2`; a crate that does not survive that target is one nobody can install.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip2
      - run: cargo fmt --check
      - run: cargo build --target wasm32-wasip2
