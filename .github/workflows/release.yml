# Publishing, which is the one thing here that cannot be taken back.
#
# It runs from a tag rather than from a push to `main`, so that publishing is a deliberate act with
# a name — `v0.1.0` — and not a side effect of merging. Everything it does is checked before
# anything is published: the suite runs first, and the tag has to agree with the versions in the
# manifests, because a tag that says one thing while the tarball says another is a release nobody
# can reason about afterwards.
#
# `id-token: write` is what this workflow authenticates with, and it does two jobs at once. It is
# what makes provenance possible — npm signs the artefact against this workflow's identity, so
# anyone can verify that the tarball on the registry was built here, from this commit, rather than
# uploaded from somebody's laptop. And for a package with Trusted Publishing configured against this
# repository and this file, it is also the credential: npm exchanges the OIDC identity for a
# short-lived one at publish time.
#
# ## There is no token here, and that is the point — except for a package's first version
#
# `0.1.0` went out with a granular token, because trusted publishing cannot publish a package's
# **first** version — it is configured in the settings of a package that already exists
# (npm/cli#8544). That is no longer true of the original three, so the token that published them was
# revoked and the `NPM_TOKEN` secret deleted. **`@sqldex/syntax-antlr` needs the same bootstrap**
# before its `npm publish` step below can run unattended: someone publishes its `0.x.0` by hand, from
# a real terminal, then adds Trusted Publishing to it in npm's settings pointing at this repository
# and this file — exactly as was done for the original three. Until then this workflow's publish
# step for it will fail with the same "package does not exist" error trusted publishing always gives
# a first version. **Nothing about this file is a secret**, which is worth saying out loud once that
# bootstrap is done: a fork cannot publish with it, because the trust is pinned to `sdvallejo/sqldex`
# and to this workflow's filename. Renaming this file breaks publishing until npm is told the new
# name.
#
# ## The one credential that is left, and when it dies
#
# `VSCE_PAT` is an Azure DevOps personal access token, and it is the exception to everything above:
# the VS Code Marketplace has no equivalent of trusted publishing. It is scoped to *Marketplace →
# Manage* over all accessible organizations, which is the least a publish can be given, and it is
# the only long-lived secret in this repository.
#
# It is also **optional**, and the steps that use it are skipped when it is absent. Getting one is
# no longer free — Azure DevOps requires an active Azure subscription to create a new organization —
# and the `.vsix` can be uploaded by hand from the publisher management page, which needs nothing
# but a Microsoft account. Either way the npm half of the release is unaffected.
#
# **Global PATs in Azure DevOps are retired on 2026-12-01.** After that date this step stops working
# and the replacement is Microsoft Entra ID with workload identity federation — `vsce publish
# --azure-credential`, against a managed identity added to the publisher as a Contributor. That is a
# migration with a deadline, not a preference, and it is written here rather than in a plan because
# this is the file that will break.
#
# `--access public` is on the command line as well as in each `publishConfig`. The manifest key did
# not take for the two scoped packages on the first release — they landed restricted, which on the
# public registry is indistinguishable from not existing — and the flag is the form that is not
# ambiguous about who reads it.
name: Release

on:
  push:
    tags: ["v*"]
  # Available by hand as well, for a re-run of a tag whose publish failed halfway.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A **boolean**, not the token: the `secrets` context is not one of the contexts a step's `if`
    # can read, so the question "is it set" has to be answered here, where it can. Answering it with
    # the secret itself would put the token in the environment of every step in the job, and only
    # one of them has any business with it.
    env:
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          # Without this the token never reaches npm: it is what writes the auth line into .npmrc.
          registry-url: "https://registry.npmjs.org"

      # Node 22.18 ships npm 10, and trusted publishing needs 11.5.1 or newer — so this step is now
      # what makes the publish possible at all, not a preparation for it.
      #
      # Pinned to the 11 line rather than `@latest`, which is how this failed the first time: npm 12
      # requires `^22.22.2 || ^24.15.0 || >=26.0.0`, and this job deliberately runs the **floor**
      # version the README promises. `@latest` on a pinned-floor runner is a step that breaks on
      # somebody else's release schedule, which is not a thing a publish should depend on.
      - run: npm install -g npm@11

      - run: npm ci

      # Nothing gets published that does not pass, and the tag push may not have run CI at all.
      - run: npm test

      # The VS Code extension is in here too. It is not a workspace and it is not published to npm,
      # but it carries a copy of the server, so a version of it that disagrees with the packages is
      # an extension whose engine is not the one its number claims.
      - name: The tag and the manifests have to agree
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          for manifest in packages/core packages/syntax-antlr packages/lsp packages/cli editors/vscode; do
            have=$(node -p "require('./$manifest/package.json').version")
            if [ "$have" != "$want" ]; then
              echo "::error::$manifest is $have but the tag says $want"
              exit 1
            fi
          done
          echo "all five are $want"

      # Core first, then syntax-antlr (which depends on core), then lsp and cli (which depend on
      # both) — a registry that has a dependent before its dependency is a few minutes of a broken
      # install for anyone quick enough to hit it.
      - run: npm publish -w @sqldex/core --access public

      - run: npm publish -w @sqldex/syntax-antlr --access public

      - run: npm publish -w @sqldex/lsp --access public

      - run: npm publish -w sqldex --access public

      # The extension has its own manifest, its own lockfile and its own dependencies, because it is
      # not a workspace: `vsce` reads `node_modules` to decide what goes inside the `.vsix`, so this
      # install is not a convenience, it is what makes the package complete.
      - run: npm ci
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        working-directory: editors/vscode

      # `vscode:prepublish` copies the server into the extension before `vsce` looks at the
      # directory, which is why there is no bundling step here: an extension packaged without it
      # installs perfectly and then has no server to start.
      #
      # Conditional because the Marketplace half of a release can be done by hand, and getting a PAT
      # is no longer free: Azure DevOps requires an active Azure subscription to create a new
      # organization, and a subscription asks for a card to verify identity. Without the secret the
      # release still happens — npm and all — and the `.vsix` gets uploaded from the publisher page.
      - name: Publish the VS Code extension
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish

      # A skipped step is a step nobody notices. This is the difference between "the extension was
      # not published" and "the extension is on the Marketplace and I have no idea why it is old".
      - name: Say that the extension was not published
        if: ${{ env.HAS_VSCE_PAT != 'true' }}
        run: |
          echo "::notice::VSCE_PAT is not set, so the extension was not published."
          echo "::notice::Build it with 'npm run package' in editors/vscode and upload the .vsix at https://marketplace.visualstudio.com/manage"
